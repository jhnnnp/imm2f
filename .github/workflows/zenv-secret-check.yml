name: Zenv Secret delivery check

on:
  workflow_dispatch:
  push:
    branches: [zenv/verify-secrets-20261007]
    paths: [.github/workflows/zenv-secret-check.yml]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Secret delivery without printing values
        env:
          ZENV_MVP_CONNECTION_TEST: ${{ secrets.ZENV_MVP_CONNECTION_TEST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const names = ['OPENAI_API_KEY', 'KAKAO_REST_API_KEY', 'SUPABASE_SECRET_KEY'];
          let passed = true;
          for (const name of names) {
            const present = Boolean(process.env[name]?.trim());
            console.log(`${name}: ${present ? 'available' : 'missing'}`);
            passed &&= present;
          }
          const roundTrip = process.env.ZENV_MVP_CONNECTION_TEST === 'zenv_synthetic_connection_check_20261007';
          console.log(`Synthetic encrypted round trip: ${roundTrip ? 'passed' : 'failed'}`);
          process.exitCode = passed && roundTrip ? 0 : 1;
          NODE
